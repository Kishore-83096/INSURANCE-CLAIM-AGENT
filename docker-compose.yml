services:
  flask-api:
    build:
      context: ./FLASK
    container_name: insurance-claim-flask
    env_file:
      - ./FLASK/.env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      UPLOAD_FOLDER: /app/uploads
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5000
    ports:
      - "5000:5000"
    volumes:
      - flask_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  react-web:
    build:
      context: ./REACT
    container_name: insurance-claim-react
    depends_on:
      flask-api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  flask_uploads:
